<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cinematic Vibes</title>

  <!-- Cinematic Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg"></div>

  <main class="app">
    <h1 class="logo">CINEMATIC VIBES</h1>

    <div class="categories">
      <button onclick="setCategory('love')">LOVE</button>
      <button onclick="setCategory('motivation')">MOTIVATION</button>
      <button onclick="setCategory('power')">POWER</button>
      <button onclick="setCategory('dark')">DARK</button>
    </div>

    <div class="quote-card">
      <p id="quote">Select a vibe and feel the cinema.</p>
    </div>

    <div class="actions">
      <button onclick="nextQuote()">NEXT</button>
      <button onclick="copyQuote()">COPY</button>
      <button onclick="shareQuote()">SHARE</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
