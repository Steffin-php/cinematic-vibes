<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cinematic Vibes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="overlay">
    <h1 class="title">🎬 Cinematic Vibes</h1>

    <div class="buttons">
      <button onclick="showQuote('love')">❤️ Love</button>
      <button onclick="showQuote('motivation')">🔥 Motivation</button>
      <button onclick="showQuote('power')">⚡ Power</button>
      <button onclick="showQuote('villain')">😈 Villain</button>
    </div>

    <div class="quote-box">
      <p id="quote">Click a category to feel the cinema.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
