<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cinematic Vibes</title>

  <!-- Strong cinematic font -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>CINEMATIC VIBES</h1>

    <div class="categories">
      <button onclick="setCategory('love')">LOVE</button>
      <button onclick="setCategory('motivation')">MOTIVATION</button>
      <button onclick="setCategory('power')">POWER</button>
      <button onclick="setCategory('dark')">DARK</button>
    </div>

    <div class="quote-box">
      <p id="quote">Choose a vibe.</p>
    </div>

    <div class="actions">
      <button onclick="nextQuote()">NEXT</button>
      <button onclick="copyQuote()">COPY</button>
      <button onclick="shareQuote()">SHARE</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
